<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secret Santa 🎁</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 0%, #35685a 0%, transparent 55%),
        linear-gradient(145deg, #081c19, #173b30 55%, #071714);
      color: #fff;
      font: 18px system-ui, sans-serif;
      text-align: center;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(90vw, 580px);
      padding: 2.5rem 2rem;
      border: 1px solid #ffffff30;
      border-radius: 28px;
      background: #ffffff0d;
      box-shadow: 0 0 80px #f5c45120, inset 0 0 30px #ffffff08;
      backdrop-filter: blur(10px);
    }

    h1 {
      margin-top: 0;
      color: #f5c451;
      font-size: clamp(2rem, 8vw, 3rem);
      text-shadow: 0 0 24px #f5c45170;
    }

    #result {
      display: grid;
      place-items: center;
      min-height: 120px;
      margin: 1.5rem 0;
      color: #f5c451;
      font-size: clamp(2rem, 9vw, 3.5rem);
      font-weight: 800;
      text-shadow: 0 0 25px #f5c45180;
    }

    #result.spinning { animation: pulse .55s ease-in-out infinite alternate; }
    #result.revealed { animation: reveal .8s cubic-bezier(.2, 1.8, .4, 1) both; }

    @keyframes pulse {
      from { transform: scale(.96) rotate(-2deg); opacity: .75; }
      to   { transform: scale(1.06) rotate(2deg); opacity: 1; }
    }

    @keyframes reveal {
      0%   { transform: scale(.2) rotate(-18deg); opacity: 0; }
      70%  { transform: scale(1.2) rotate(5deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); }
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 16px 28px;
      background: linear-gradient(135deg, #ffe27a, #e9a91d);
      color: #18352d;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 0 #986c13, 0 0 30px #f5c45150;
      transition: transform .2s, box-shadow .2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 9px 0 #986c13, 0 0 40px #f5c45190;
    }

    button:disabled { cursor: default; opacity: .8; }

    .small { opacity: .8; font-size: .95rem; }

    .confetti {
      position: fixed;
      z-index: 5;
      top: -20px;
      width: 10px;
      height: 16px;
      pointer-events: none;
      animation: fall var(--duration) linear forwards;
    }

    @keyframes fall {
      to { transform: translate3d(var(--drift), 110vh, 0) rotate(900deg); }
    }
  </style>
</head>
<body>
<main>
  <h1>🎄 Secret Santa 🎁</h1>
  <p id="intro">Prêt·e à découvrir qui tu vas gâter ?</p>
  <div id="result"></div>
  <button id="draw">Lancer le tirage</button>
  <p class="small" id="note">🤫 Garde ton résultat secret !</p>
</main>

<script>
  // Code personnel : [Prénom du donneur, Prénom du receveur]
  const draws = {
    "v4e5s6": ["Test1", "Test2"],
    "k7m4q9": ["Cyril", "Rémi"],
    "v2p8x5": ["Christelle", "Grégoire"],
    "n6r3w1": ["Clément", "Fiorella"],
    "c9t5h2": ["FX", "Sara"],
    "y4b7k3": ["Guillaume", "Violette"],
    "m8q2d6": ["Quentin", "Simon"],
    "f3x9p4": ["Damien", "Patrice"],
    "w5n1c8": ["JB", "Nolwenn"],
    "h2v6r7": ["Rémi", "Daniel"],
    "p4k8y2": ["Grégoire", "Damien"],
    "d7m3q5": ["Fiorella", "Isabelle"],
    "x1c9v6": ["Romane", "Daniel"],
    "r8h4n2": ["Sara", "Isabelle"],
    "b5p7w3": ["Violette", "Cyril"],
    "q2y6f9": ["Simon", "Christelle"],
    "t4d8m1": ["Patrice", "Clément"],
    "g9r3x5": ["Nolwenn", "FX"],
    "z6c2h8": ["Daniel", "Guillaume"],
    "a3v7p4": ["Isabelle", "Quentin"]
  };

  const key = location.hash.slice(1).toLowerCase();
  const draw = draws[key];
  const button = document.getElementById("draw");
  const intro = document.getElementById("intro");
  const result = document.getElementById("result");

  if (!draw) {
    intro.textContent = "Lien incomplet : demande à l’organisateur ton lien personnel.";
    button.hidden = true;
  } else {
    intro.textContent = `Bonjour ${draw[0]} !`;

    button.addEventListener("click", () => {
      button.disabled = true;
      button.textContent = "Le destin choisit…";
      result.classList.add("spinning");

      const names = Object.values(draws).map(item => item[1]);
      const start = Date.now();
      const duration = 6000;

      function spin() {
        result.textContent = "🎁 " + names[Math.floor(Math.random() * names.length)];

        const elapsed = Date.now() - start;
        if (elapsed >= duration) {
          result.textContent = "🎁 " + draw[1];
          result.classList.remove("spinning");
          result.classList.add("revealed");
          button.textContent = "✨ Tirage révélé ✨";
          confetti();
          return;
        }

        // Les noms défilent de plus en plus lentement.
        const progress = elapsed / duration;
        const delay = 55 + Math.pow(progress, 3) * 650;
        setTimeout(spin, delay);
      }

      spin();
    });
  }

  function confetti() {
    const colors = ["#f5c451", "#ff6685", "#63e6be", "#74c0fc", "#fff"];
    for (let i = 0; i < 100; i++) {
      const piece = document.createElement("i");
      piece.className = "confetti";
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.setProperty("--drift", (Math.random() * 300 - 150) + "px");
      piece.style.setProperty("--duration", (2 + Math.random() * 3) + "s");
      piece.style.animationDelay = Math.random() * 0.8 + "s";
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 6000);
    }
  }
</script>
</body>
</html>
